nodeLinker: node-modules

# Yarn refuses to install package versions younger than npmMinimalAgeGate (default 24h) as a
# supply-chain precaution, reporting them as "quarantined". We trust our own scope, so exempt it —
# otherwise a freshly-published @philosoph content/contract package is unusable for a day.
npmPreapprovedPackages:
  - "@philosoph/*"
